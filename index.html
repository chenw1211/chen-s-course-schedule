<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海海事大学 2026—2027学年第一学期研究生课表（非全日制）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #1a2733;
            --ink-soft: #4a5a6a;
            --ink-faint: #8296a8;
            --line: #e3eaf1;
            --line-soft: #eef3f8;
            --bg: #eef2f6;
            --paper: #ffffff;
            --navy: #163a5f;
            --navy-deep: #0f2945;
            --accent: #c8a45c;
            --weekend: #f6f9fc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 24px 16px 48px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
        }

        /* ===== 页眉 ===== */
        .masthead {
            background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 60%, #1f4a75 100%);
            border-radius: 18px;
            padding: 30px 34px;
            color: #fff;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(15, 41, 69, 0.22);
        }

        .masthead::after {
            content: '';
            position: absolute;
            right: -60px;
            top: -60px;
            width: 240px;
            height: 240px;
            border: 2px solid rgba(200, 164, 92, 0.18);
            border-radius: 50%;
        }

        .masthead::before {
            content: '';
            position: absolute;
            right: 10px;
            top: 10px;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(200, 164, 92, 0.12);
            border-radius: 50%;
        }

        .school-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .school-badge {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(200, 164, 92, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .school-badge svg {
            width: 26px;
            height: 26px;
            fill: var(--accent);
        }

        .school-name {
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.82;
        }

        .masthead h1 {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .masthead .meta {
            font-size: 13.5px;
            opacity: 0.82;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            position: relative;
            z-index: 1;
        }

        .masthead .meta span::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 8px;
            vertical-align: middle;
        }

        /* ===== 周次控制条 ===== */
        .control-bar {
            background: var(--paper);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 2px 10px rgba(26, 39, 51, 0.05);
        }

        .week-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #f8fafc;
            color: var(--navy);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
        }

        .nav-btn:hover {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            background: #f8fafc;
            color: var(--navy);
            border-color: var(--line);
        }

        .week-label {
            min-width: 168px;
            text-align: center;
        }

        .week-label .week-num {
            font-size: 19px;
            font-weight: 700;
            color: var(--navy);
            display: block;
        }

        .week-label .week-date {
            font-size: 12px;
            color: var(--ink-faint);
            margin-top: 2px;
            display: block;
        }

        .week-jump {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .jump-btn {
            padding: 8px 14px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: #f8fafc;
            color: var(--ink-soft);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.18s;
        }

        .jump-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        .jump-btn.current-badge {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
        }

        /* ===== 调课提示 ===== */
        .notice {
            background: #fdf8ee;
            border: 1px solid #efd9b0;
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #7a5a20;
            line-height: 1.7;
            display: none;
        }

        .notice.show {
            display: block;
        }

        .notice strong {
            color: #5f4413;
        }

        .notice .notice-title {
            font-weight: 700;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .notice svg {
            width: 16px;
            height: 16px;
            fill: #c89538;
            flex-shrink: 0;
        }

        /* ===== 课表网格 ===== */
        .grid-card {
            background: var(--paper);
            border-radius: 16px;
            box-shadow: 0 2px 14px rgba(26, 39, 51, 0.06);
            overflow: hidden;
        }

        .grid-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .grid {
            display: grid;
            grid-template-columns: 86px repeat(7, minmax(108px, 1fr));
            min-width: 920px;
        }

        /* 表头 */
        .corner {
            background: var(--navy-deep);
            color: rgba(255,255,255,0.75);
            padding: 14px 6px;
            font-size: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .day-head {
            background: var(--navy-deep);
            color: #fff;
            padding: 13px 6px;
            text-align: center;
            border-left: 1px solid rgba(255,255,255,0.08);
        }

        .day-head .d-name {
            font-size: 14px;
            font-weight: 600;
            display: block;
        }

        .day-head .d-date {
            font-size: 11.5px;
            opacity: 0.65;
            margin-top: 3px;
            display: block;
            font-variant-numeric: tabular-nums;
        }

        .day-head.is-today {
            background: #1d4d7a;
        }

        .day-head.is-today .d-name::after {
            content: '·今天';
            color: var(--accent);
            font-size: 11px;
            margin-left: 3px;
        }

        .day-head.weekend-head .d-name {
            color: var(--accent);
        }

        /* 时间列与单元格 */
        .time-cell {
            padding: 8px 6px;
            background: #f8fafc;
            border-top: 1px solid var(--line-soft);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 58px;
        }

        /* 时段分隔（上午/下午/晚上之间） */
        .time-cell.session-start,
        .cell.session-start {
            border-top: 2px solid #cfdbe7;
        }

        .time-cell .t-session {
            font-size: 10px;
            color: var(--navy);
            background: #e4edf6;
            border-radius: 5px;
            padding: 1px 6px;
            margin-bottom: 5px;
            align-self: center;
            letter-spacing: 1px;
        }

        .time-cell .t-period {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--ink-soft);
        }

        .time-cell .t-time {
            font-size: 10.5px;
            color: var(--ink-faint);
            margin-top: 4px;
            line-height: 1.4;
            font-variant-numeric: tabular-nums;
        }

        .cell {
            border-top: 1px solid var(--line-soft);
            border-left: 1px solid var(--line-soft);
            padding: 7px;
            position: relative;
            min-height: 58px;
        }

        .cell.is-today-col {
            background: #eef5fb;
        }

        /* 课程卡片 */
        .course {
            border-radius: 10px;
            padding: 11px 12px 11px 14px;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.18s, box-shadow 0.18s;
        }

        .course:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(22, 58, 95, 0.16);
        }

        .course::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
        }

        .course .c-name {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 7px;
        }

        .course .c-row {
            font-size: 11.5px;
            display: flex;
            align-items: center;
            gap: 5px;
            line-height: 1.5;
            opacity: 0.85;
        }

        .course .c-row svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .course .c-weeks {
            margin-top: 7px;
            font-size: 10.5px;
            padding: 2px 8px;
            border-radius: 20px;
            align-self: flex-start;
            background: rgba(255,255,255,0.55);
            font-weight: 600;
        }

        /* 课程配色 */
        .c-blue   { background: #e8f2fc; color: #1b5e96; }
        .c-blue::before   { background: #2f80c4; }
        .c-red    { background: #fdeeec; color: #b23c30; }
        .c-red::before    { background: #d65544; }
        .c-orange { background: #fdf3e6; color: #a86218; }
        .c-orange::before { background: #e08a2e; }
        .c-teal   { background: #e6f6f3; color: #17705f; }
        .c-teal::before   { background: #2aa38c; }
        .c-green  { background: #ebf6ec; color: #2e7040; }
        .c-green::before  { background: #4a9e62; }
        .c-purple { background: #f1ecfa; color: #5f43a0; }
        .c-purple::before { background: #7c5dc4; }
        .c-indigo { background: #eceffb; color: #3a4a9e; }
        .c-indigo::before { background: #5868c8; }
        .c-plum   { background: #f7ecf5; color: #8c3f7a; }
        .c-plum::before   { background: #b3589c; }
        .c-rose   { background: #fceef3; color: #a83d65; }
        .c-rose::before   { background: #d45987; }

        /* 调休占位 */
        .adjust-cell {
            border: 1.5px dashed #e0b96f;
            border-radius: 10px;
            background: #fdfaf3;
            padding: 10px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
            color: #a67c2e;
        }

        .adjust-cell svg {
            width: 20px;
            height: 20px;
            fill: #d0a24c;
        }

        .adjust-cell .a-title {
            font-size: 12px;
            font-weight: 700;
        }

        .adjust-cell .a-desc {
            font-size: 10.5px;
            line-height: 1.5;
            color: #b08a48;
        }

        /* ===== 图例与课程总览 ===== */
        .below-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }

        .panel {
            background: var(--paper);
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 2px 10px rgba(26, 39, 51, 0.05);
        }

        .panel h3 {
            font-size: 14px;
            color: var(--navy);
            margin-bottom: 13px;
            padding-bottom: 9px;
            border-bottom: 1px solid var(--line-soft);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel h3::before {
            content: '';
            width: 4px;
            height: 15px;
            background: var(--accent);
            border-radius: 2px;
        }

        .legend-group {
            margin-bottom: 12px;
        }

        .legend-group:last-child {
            margin-bottom: 0;
        }

        .legend-group-title {
            font-size: 11.5px;
            color: var(--ink-faint);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--ink-soft);
            background: #f6f9fc;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .legend-chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .overview-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed var(--line-soft);
            font-size: 12.5px;
        }

        .overview-item:last-child {
            border-bottom: none;
        }

        .overview-item .o-dot {
            width: 8px;
            height: 8px;
            border-radius: 3px;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .overview-item .o-body {
            flex: 1;
            min-width: 0;
        }

        .overview-item .o-name {
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .overview-item .o-info {
            color: var(--ink-faint);
            font-size: 11.5px;
            line-height: 1.5;
        }

        .footer-note {
            text-align: center;
            font-size: 11.5px;
            color: var(--ink-faint);
            margin-top: 22px;
            line-height: 1.8;
        }

        /* ===== 移动端 ===== */
        @media (max-width: 720px) {
            body {
                padding: 14px 8px 36px;
            }

            .masthead {
                padding: 22px 20px;
                border-radius: 14px;
            }

            .masthead h1 {
                font-size: 18px;
                line-height: 1.4;
            }

            .control-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .week-nav {
                justify-content: space-between;
            }

            .week-jump {
                justify-content: center;
            }

            .below-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== 页眉 ===== -->
        <header class="masthead">
            <div class="school-row">
                <div class="school-badge">
                    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                </div>
                <div class="school-name">上海海事大学 · SHANGHAI MARITIME UNIVERSITY</div>
            </div>
            <h1>2026—2027学年第一学期研究生课表</h1>
            <div class="meta">
                <span>非全日制 · 工业工程与管理（物工）2026级</span>
                <span>授课地点：港湾教学楼</span>
                <span>第1周：9月14日 — 9月20日</span>
            </div>
        </header>

        <!-- ===== 周次控制 ===== -->
        <div class="control-bar">
            <div class="week-nav">
                <button class="nav-btn" id="prevBtn" aria-label="上一周">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <div class="week-label">
                    <span class="week-num" id="weekNum">第 1 周</span>
                    <span class="week-date" id="weekDate"></span>
                </div>
                <button class="nav-btn" id="nextBtn" aria-label="下一周">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
            <div class="week-jump">
                <button class="jump-btn" id="todayBtn">回到本周</button>
                <button class="jump-btn" data-jump="1">第1周</button>
                <button class="jump-btn" data-jump="6">第6周</button>
                <button class="jump-btn" data-jump="10">第10周</button>
                <button class="jump-btn" data-jump="14">第14周</button>
            </div>
        </div>

        <!-- ===== 调课提示 ===== -->
        <div class="notice" id="notice">
            <div class="notice-title">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span id="noticeTitle"></span>
            </div>
            <div id="noticeBody"></div>
        </div>

        <!-- ===== 课表 ===== -->
        <div class="grid-card">
            <div class="grid-scroll">
                <div class="grid" id="grid">
                    <!-- 由 JS 渲染 -->
                </div>
            </div>
        </div>

        <!-- ===== 图例 + 课程总览 ===== -->
        <div class="below-grid">
            <div class="panel" id="legendPanel">
                <h3>课程图例</h3>
                <div class="legend-group">
                    <div class="legend-group-title">公共课（研究生院开课 · 港湾114）</div>
                    <div class="legend-items" id="publicLegend"></div>
                </div>
                <div class="legend-group">
                    <div class="legend-group-title">专业课（物流工程学院 · 港湾218）</div>
                    <div class="legend-items" id="majorLegend"></div>
                </div>
            </div>
            <div class="panel">
                <h3>本周课程安排</h3>
                <div id="weekOverview"></div>
            </div>
        </div>

        <div class="footer-note">
            原则上节假日正常授课；调休工作日9月20日的课程后延至10月18日，10月10日课程后延至10月17日（10月17、18日属第5周）<br>
            课表依据《2026—2027学年第一学期非全日制研究生课表》整理，实际安排以研究生院通知为准
        </div>
    </div>

        var DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

        // ==================== 课程数据 ====================
        // day: 1=周一 ... 6=周六, 0=周日；startPeriod: 起始节次号；span: 连续跨越节数

            // ---------- 星期六 上午 1-4节 ----------

            { name: '自然辩证法概论', teacher: '余成跃', room: '港湾 114', day: 6, startPeriod: 1, span: 4,
              weeks: [10,11,12,13], weekText: '第10-13周', color: 'c-orange', category: 'public' },
            { name: '新时代中国特色社会主义理论与实践', teacher: '张宏斌', room: '港湾 114', day: 6, startPeriod: 1, span: 4,
              weeks: [14,15,16,17], weekText: '第14-17周', color: 'c-red', category: 'public' },

            // ---------- 星期六 下午 7-10节 ----------
            { name: '学科研究前沿', teacher: '肖世昌', room: '港湾 218', day: 6, startPeriod: 7, span: 4,
              weeks: [1,2,3,5], weekText: '第1-3、5周', color: 'c-green', category: 'major' },
            { name: '高等运筹学', teacher: '汤莲花', room: '港湾 218', day: 6, startPeriod: 7, span: 4,
              weeks: [6,7,8,9], weekText: '第6-9周', color: 'c-plum', category: 'major' },
            { name: '高等工程统计学', teacher: '舒帆', room: '港湾 218', day: 6, startPeriod: 7, span: 4,
              weeks: [10,11,12,13,14,15,16,17], weekText: '第10-17周', color: 'c-rose', category: 'major' },

            // ---------- 星期日 上午 1-4节 ----------
            { name: '系统工程', teacher: '杨阳', room: '港湾 218', day: 0, startPeriod: 1, span: 4,
              weeks: [2,3,4,5], weekText: '第2-5周', color: 'c-teal', category: 'major' },
            { name: '工程系统建模与仿真', teacher: '杨小明', room: '港湾 218', day: 0, startPeriod: 1, span: 4,
              weeks: [6,7,8,9,10,11,12,13], weekText: '第6-13周', color: 'c-indigo', category: 'major' },
            { name: '新时代中国特色社会主义理论与实践', teacher: '张宏斌', room: '港湾 114', day: 0, startPeriod: 1, span: 4,
              weeks: [14,15,16,17], weekText: '第14-17周', color: 'c-red', category: 'public' },

            // ---------- 星期日 下午 7-10节 ----------
            { name: '科学道德与论文写作', teacher: '孟燕萍', room: '港湾 114', day: 0, startPeriod: 7, span: 4,
              weeks: [1,2,3,4,5], weekText: '第1-5周', color: 'c-purple', category: 'public' },
            { name: '定量分析：模型与方法', teacher: '郑鹏', room: '港湾 218', day: 0, startPeriod: 7, span: 4,
              weeks: [6,7,8,9,10,11,12,13], weekText: '第6-13周', color: 'c-blue', category: 'major' }
        ];

        // ==================== 调课安排 ====================
        // type: suspended=停课调休日（当天课程不上，隐藏课程）；makeup=补课日（正常上课，仅提示）
        var ADJUSTMENTS = {
            '1-0': {
                type: 'suspended',
                title: '9月20日（周日·第1周）调休工作日',
                body: '当日课程后延至 <strong>10月18日（周日·第5周）</strong> 授课，本日不上课。'
            },
            '4-6': {
                type: 'suspended',
                title: '10月10日（周六·第4周）课程调整',
                body: '当日课程后延至 <strong>10月17日（周六·第5周）</strong> 授课，本日不上课。'
            },
            '5-6': {
                type: 'makeup',
                title: '10月17日（周六·第5周）补课日',
                body: '本日正常上课，同时补授 <strong>10月10日（第4周周六）</strong> 的课程，具体补课时段以任课教师通知为准。'
            },
            '5-0': {
                type: 'makeup',
                title: '10月18日（周日·第5周）补课日',
                body: '本日正常上课，同时补授 <strong>9月20日（第1周周日）</strong> 的课程，具体补课时段以任课教师通知为准。'
            }
        };

        function isSuspended(week, day) {
            var a = ADJUSTMENTS[week + '-' + day];
            return !!(a && a.type === 'suspended');
        }

        var COLOR_MAP = {
            'c-blue': '#2f80c4', 'c-red': '#d65544', 'c-orange': '#e08a2e',
            'c-teal': '#2aa38c', 'c-green': '#4a9e62', 'c-purple': '#7c5dc4',
            'c-indigo': '#5868c8', 'c-plum': '#b3589c', 'c-rose': '#d45987'
        };

        // ==================== 工具函数 ====================
        function formatDate(d) {
            return (d.getMonth() + 1) + '月' + d.getDate() + '日';
        }

        function getMonday(week) {
            var d = new Date(SEMESTER_START);
            d.setDate(d.getDate() + (week - 1) * 7);
            return d;
        }

        function getCurrentWeek() {
            var now = new Date();
            now.setHours(0, 0, 0, 0);
            var start = new Date(SEMESTER_START);
            start.setHours(0, 0, 0, 0);
            var diff = Math.floor((now - start) / 86400000);
            if (diff < 0) return 0;
            var week = Math.floor(diff / 7) + 1;
            return (week >= 1 && week <= TOTAL_WEEKS) ? week : -1;
        }

        // 节次号 -> 时间轴数组索引
        function periodIndex(no) {
            for (var i = 0; i < PERIODS.length; i++) {
                if (PERIODS[i].no === no) return i;
            }
            return -1;
        }

        // 判断某节次是否被某门连堂课的卡片覆盖（起始节之外的中间节）
        function isPeriodCovered(week, day, periodNo) {
            for (var i = 0; i < COURSES.length; i++) {
                var c = COURSES[i];
                if (!isSuspended(week, day) && c.day === day && c.weeks.indexOf(week) !== -1 &&
                    periodNo > c.startPeriod && periodNo < c.startPeriod + c.span) {
                    return true;
                }
            }
            return false;
        }

        // ==================== 渲染课程卡片 ====================
        function renderCourse(c) {
            return '<div class="course ' + c.color + '">' +
                '<div class="c-name">' + c.name + '</div>' +
                '<div class="c-row"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>' + c.room + '</div>' +
                '<div class="c-row"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>' + c.teacher + '</div>' +
                '<span class="c-weeks">' + c.weekText + '</span>' +
                '</div>';
        }

        function renderAdjust(key) {
            var a = ADJUSTMENTS[key];
            var plainText = a.body.replace(/<[^>]+>/g, '');
            return '<div class="adjust-cell">' +
                '<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"/></svg>' +
                '<div class="a-title">调休 · 不上课</div>' +
                '<div class="a-desc">' + plainText + '</div>' +
                '</div>';
        }

        // ==================== 渲染课表 ====================
        function renderGrid(week) {
            var grid = document.getElementById('grid');
            grid.innerHTML = '';
            var todayDay = new Date().getDay();
            var currentWeek = getCurrentWeek();
            var monday = getMonday(week);

            // 左上角（显式定位：第1列第1行）
            var corner = document.createElement('div');
            corner.className = 'corner';
            corner.style.gridColumn = '1';
            corner.style.gridRow = '1';
            corner.innerHTML = '<span>节次</span><span style="margin-top:4px;opacity:0.6;font-size:11px;">时间</span>';
            grid.appendChild(corner);

            // 星期表头（第1行，第2-8列）
            for (var i = 1; i <= 7; i++) {
                var dayValue = i === 7 ? 0 : i;
                var head = document.createElement('div');
                var cls = 'day-head';
                if (dayValue === 6 || dayValue === 0) cls += ' weekend-head';
                if (currentWeek === week && dayValue === todayDay) cls += ' is-today';
                head.className = cls;
                head.style.gridColumn = (i + 1);
                head.style.gridRow = '1';

                var colDate = new Date(monday);
                colDate.setDate(monday.getDate() + i - 1);

                head.innerHTML = '<span class="d-name">' + DAYS[i - 1] + '</span>' +
                                 '<span class="d-date">' + (colDate.getMonth() + 1) + '/' + colDate.getDate() + '</span>';
                grid.appendChild(head);
            }

            // 本周课程索引（停课调休日当天课程不显示），key = 星期-起始节次
            var weekCourses = {};
            COURSES.forEach(function(c) {
                if (c.weeks.indexOf(week) !== -1 && !isSuspended(week, c.day)) {
                    weekCourses[c.day + '-' + c.startPeriod] = c;
                }
            });

            // 时间列（第1列，第2行起；共 PERIODS.length 个节次行）
            for (var ti = 0; ti < PERIODS.length; ti++) {
                var p = PERIODS[ti];
                var timeCell = document.createElement('div');
                var tCls = 'time-cell';
                // 每个时段（上午/下午/晚上）的第一节加分隔样式
                if (ti === 0 || PERIODS[ti - 1].session !== p.session) tCls += ' session-start';
                timeCell.className = tCls;
                timeCell.style.gridColumn = '1';
                timeCell.style.gridRow = (ti + 2);
                var sessionTag = (ti === 0 || PERIODS[ti - 1].session !== p.session)
                    ? '<span class="t-session">' + p.session + '</span>' : '';
                timeCell.innerHTML = sessionTag +
                    '<span class="t-period">' + p.label + '</span>' +
                    '<span class="t-time">' + p.time + '</span>';
                grid.appendChild(timeCell);
            }

            // 课程 / 单元格（显式定位：列=星期+2，行=节次索引+2；被连堂课覆盖的中间节不创建格子）
            for (var d = 1; d <= 7; d++) {
                var dv = d === 7 ? 0 : d;
                var col = d + 1;
                var isWeekend = (dv === 6 || dv === 0);
                var adjustKey = week + '-' + dv;

                for (var pi = 0; pi < PERIODS.length; pi++) {
                    var periodNo = PERIODS[pi].no;
                    var row = pi + 2;
                    var sessionStart = (pi === 0 || PERIODS[pi - 1].session !== PERIODS[pi].session);
                    var course = weekCourses[dv + '-' + periodNo];

                    // 停课调休日：仅在首节创建一个跨全部节次的调休卡片
                    if (isSuspended(week, dv)) {
                        if (pi === 0) {
                            var aCell = document.createElement('div');
                            aCell.className = 'cell weekend' + (currentWeek === week && dv === todayDay ? ' is-today-col' : '');
                            aCell.style.gridColumn = col;
                            aCell.style.gridRow = '2 / span ' + PERIODS.length;
                            aCell.innerHTML = renderAdjust(adjustKey);
                            grid.appendChild(aCell);
                        }
                        continue;
                    }

                    // 课程起始格
                    if (course) {
                        var cCell = document.createElement('div');
                        var cCls = 'cell';
                        if (isWeekend) cCls += ' weekend';
                        if (currentWeek === week && dv === todayDay) cCls += ' is-today-col';
                        cCell.className = cCls;
                        cCell.style.gridColumn = col;
                        cCell.style.gridRow = row + ' / span ' + course.span;
                        cCell.innerHTML = renderCourse(course);
                        grid.appendChild(cCell);
                        continue;
                    }

                    // 被连堂课覆盖的中间节：不创建格子
                    if (isPeriodCovered(week, dv, periodNo)) {
                        continue;
                    }

                    // 普通空格：不放置任何内容，工作日与周末无课格子样式一致
                    var eCell = document.createElement('div');
                    var eCls = 'cell';
                    if (sessionStart) eCls += ' session-start';
                    if (currentWeek === week && dv === todayDay) eCls += ' is-today-col';
                    eCell.className = eCls;
                    eCell.style.gridColumn = col;
                    eCell.style.gridRow = row;
                    grid.appendChild(eCell);
                }
            }
        }

        // ==================== 渲染图例 ====================
        function renderLegend() {
            var publicUsed = {};
            var majorUsed = {};
            COURSES.forEach(function(c) {
                var map = c.category === 'public' ? publicUsed : majorUsed;
                if (!map[c.name]) map[c.name] = c.color;
            });

            function chipHtml(name, color) {
                return '<span class="legend-chip"><span class="dot" style="background:' + COLOR_MAP[color] + '"></span>' + name + '</span>';
            }

            document.getElementById('publicLegend').innerHTML =
                Object.keys(publicUsed).map(function(n) { return chipHtml(n, publicUsed[n]); }).join('');
            document.getElementById('majorLegend').innerHTML =
                Object.keys(majorUsed).map(function(n) { return chipHtml(n, majorUsed[n]); }).join('');
        }

        // ==================== 渲染本周总览 ====================
        function renderOverview(week) {
            var el = document.getElementById('weekOverview');
            var list = COURSES.filter(function(c) {
                return c.weeks.indexOf(week) !== -1 && !isSuspended(week, c.day);
            });
            list.sort(function(a, b) { return (a.day === 0 ? 7 : a.day) - (b.day === 0 ? 7 : b.day) || a.startPeriod - b.startPeriod; });

            // 停课日提示
            var suspendedHtml = '';
            Object.keys(ADJUSTMENTS).forEach(function(k) {
                var parts = k.split('-');
                if (parseInt(parts[0], 10) === week && ADJUSTMENTS[k].type === 'suspended') {
                    var dayName = parts[1] === '6' ? '周六' : '周日';
                    suspendedHtml += '<div class="overview-item">' +
                        '<span class="o-dot" style="background:#d0a24c"></span>' +
                        '<div class="o-body"><div class="o-name">' + dayName + ' · 调休不上课</div>' +
                        '<div class="o-info">' + ADJUSTMENTS[k].body.replace(/<[^>]+>/g, '') + '</div></div></div>';
                }
            });

            if (list.length === 0 && !suspendedHtml) {
                el.innerHTML = '<div style="text-align:center;color:var(--ink-faint);font-size:13px;padding:20px 0;">本周无课程安排</div>';
                return;
            }

            el.innerHTML = list.map(function(c) {
                var dayName = c.day === 6 ? '周六' : (c.day === 0 ? '周日' : DAYS[c.day - 1]);
                var periodText = c.startPeriod === 1 ? '上午 第1-4节 · 8:30-11:45' : '下午 第7-10节 · 13:00-16:15';
                return '<div class="overview-item">' +
                    '<span class="o-dot" style="background:' + COLOR_MAP[c.color] + '"></span>' +
                    '<div class="o-body">' +
                    '<div class="o-name">' + dayName + ' · ' + c.name + '</div>' +
                    '<div class="o-info">' + periodText + ' ｜ ' + c.room + ' ｜ ' + c.teacher + '</div>' +
                    '</div></div>';
            }).join('') + suspendedHtml;
        }

        // ==================== 调课通知 ====================
        function renderNotice(week) {
            var notice = document.getElementById('notice');
            var keys = Object.keys(ADJUSTMENTS).filter(function(k) { return parseInt(k, 10) === week; });
            if (keys.length === 0) {
                notice.classList.remove('show');
                return;
            }
            document.getElementById('noticeTitle').textContent = '本周有 ' + keys.length + ' 项调课安排';
            document.getElementById('noticeBody').innerHTML = keys.map(function(k) {
                return '<strong>' + ADJUSTMENTS[k].title + '：</strong>' + ADJUSTMENTS[k].body;
            }).join('<br>');
            notice.classList.add('show');
        }

        // ==================== 更新周次 ====================
        var currentWeek = 1;

        function update(week) {
            currentWeek = week;
            var monday = getMonday(week);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            document.getElementById('weekNum').textContent = '第 ' + week + ' 周';
            document.getElementById('weekDate').textContent =
                formatDate(monday) + ' — ' + formatDate(sunday);

            document.getElementById('prevBtn').disabled = week <= 1;
            document.getElementById('nextBtn').disabled = week >= TOTAL_WEEKS;

            var jumpBtns = document.querySelectorAll('.jump-btn[data-jump]');
            jumpBtns.forEach(function(btn) {
                if (parseInt(btn.dataset.jump, 10) === week) {
                    btn.classList.add('current-badge');
                } else {
                    btn.classList.remove('current-badge');
                }
            });

            renderGrid(week);
            renderOverview(week);
            renderNotice(week);
        }

        // ==================== 事件绑定 ====================
        document.getElementById('prevBtn').addEventListener('click', function() {
            if (currentWeek > 1) update(currentWeek - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', function() {
            if (currentWeek < TOTAL_WEEKS) update(currentWeek + 1);
        });

        document.querySelectorAll('.jump-btn[data-jump]').forEach(function(btn) {
            btn.addEventListener('click', function() { update(parseInt(btn.dataset.jump, 10)); });
        });

        document.getElementById('todayBtn').addEventListener('click', function() {
            var w = getCurrentWeek();
            update(w >= 1 ? w : 1);
        });

        // ==================== 初始化 ====================
        renderLegend();
        var initWeek = getCurrentWeek();
        update(initWeek >= 1 ? initWeek : 1);
    </script>
</body>
